{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- google fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'usuarios/css/login.css' %}">

    <title>Registrar Progresso</title>
</head>
<body>
    <main>
        <div class="div_title">
            <h2>Registrar Progresso</h2>
            <p>Digite seu endereço de e-mail, nome de usuário e sua senha para criar sua conta.</p>
        </div>
        <form method="post">
            {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Salvar</button>
            </form>
    </main>
    
</body>
</html>
